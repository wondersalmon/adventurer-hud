name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "beta/**"
      - "feature/**"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check:ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check browser layout
        run: npm run test:ui

      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-diagnostics-${{ github.sha }}
          path: |
            dev/playwright-report
            dev/test-results
            dev/coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: Check out pinned private release toolkit for trusted builds
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7
        with:
          repository: wondersalmon/foundry-release-tools
          ref: 9ad17b969cb2c6ce51a92b036f36b3be84fa8dc5
          path: dev/release-tools
          ssh-key: ${{ secrets.RELEASE_TOOLS_SSH_KEY }}
          persist-credentials: false

      - name: Install pinned toolkit dependencies
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm ci --prefix dev/release-tools --omit=dev --ignore-scripts

      - name: Build and verify with shared toolkit
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm run release:build
          npm run release:verify

      - name: Build fork package without private credentials
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: adventurer-hud-${{ github.sha }}
          path: |
            dist/module.json
            dist/adventurer-hud.zip
            dist/release-notes.md
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
