name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag (for example v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Run checks
        run: npm run check

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check browser layout
        run: npm run test:ui

      - name: Build release assets
        run: npm run build

      - name: Prepare release notes
        run: npm run release:notes

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/module.json
          dist/adventurer-hud.zip
          --notes-file dist/release-notes.md
          --title "Adventurer HUD ${GITHUB_REF_NAME}"

  publish-foundry:
    concurrency:
      group: foundry-release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    timeout-minutes: 10
    needs: release
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check out publication tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false

      - name: Verify release assets and publish to Foundry
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: node .release-tools/tools/publish-foundry.mjs
