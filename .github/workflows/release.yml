name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (stable or beta)"
        required: true
        type: string
      stage:
        description: "Resume GitHub release creation or retry Foundry publication"
        type: choice
        options: [foundry, release]
        default: foundry

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || inputs.stage == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Check out pinned private release toolkit
        uses: actions/checkout@v7
        with:
          repository: wondersalmon/foundry-release-tools
          ref: ce0605457e7fe4b12ace77be224d8f9819038de2
          path: dev/release-tools
          ssh-key: ${{ secrets.RELEASE_TOOLS_SSH_KEY }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install pinned toolkit dependencies
        run: npm ci --prefix dev/release-tools --omit=dev --ignore-scripts

      - name: Verify tag and package version
        run: node --input-type=module -e 'import {parseVersion} from "./dev/release-tools/src/contract.mjs"; import {readFile} from "node:fs/promises"; const p=JSON.parse(await readFile("package.json","utf8")); if(parseVersion(p.version).tag!==process.env.RELEASE_TAG) throw new Error("Tag and package version differ");'

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check:ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check browser layout
        run: npm run test:ui

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics-${{ inputs.tag || github.ref_name }}
          path: |
            dev/coverage
            dev/benchmarks
            dev/playwright-report
            dev/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build release assets
        run: npm run release:build -- --release

      - name: Verify release package
        run: npm run release:verify -- --release

      - name: Publish or resume GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:github

  publish-foundry:
    concurrency:
      group: foundry-release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    timeout-minutes: 10
    needs: release
    if: ${{ always() && !contains(inputs.tag || github.ref_name, '-') && ((github.event_name == 'workflow_dispatch' && inputs.stage != 'release') || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Check out pinned private release toolkit
        uses: actions/checkout@v7
        with:
          repository: wondersalmon/foundry-release-tools
          ref: ce0605457e7fe4b12ace77be224d8f9819038de2
          path: dev/release-tools
          ssh-key: ${{ secrets.RELEASE_TOOLS_SSH_KEY }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify release assets and publish to Foundry
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: node dev/release-tools/bin/publish-foundry.mjs
